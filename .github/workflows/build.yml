name: Build and regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  release-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/release.py check
      - run: python3 tests/release_tools.py
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [release, cpu-only, cli, sanitized]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libglib2.0-dev libxml2-dev libassimp-dev libpng-dev libjpeg-dev zlib1g-dev qt6-base-dev
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - run: ctest --preset ${{ matrix.preset }}
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [release, cpu-only, cli]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-pkgconf mingw-w64-x86_64-glib2 mingw-w64-x86_64-libxml2 mingw-w64-x86_64-assimp mingw-w64-x86_64-libpng mingw-w64-x86_64-libjpeg-turbo mingw-w64-x86_64-zlib mingw-w64-x86_64-python mingw-w64-x86_64-qt6-base
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - run: ctest --preset ${{ matrix.preset }}
